[package]
name = "image_flow_lib"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
name = "image_flow"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "fetch_json_locations"
path = "../scripts/fetch_json_locations.rs"

[features]
default = []
video = ["dep:ffmpeg-sys-next"]

[dependencies]
# chrono = "0.4"
# opencv = { version = "0.100", features = ["clang-runtime"] }
# toml = { version = "1.1", features = ["serde"] }
# uuid = { version = "1.24", features = ["v7", "serde"] }
ffmpeg-sys-next = { version = "9", features = ["build"], optional = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ultralytics-inference = { version = "0.0", default-features = false, features = [
  "annotate",
] }
uniffi.workspace = true

[dev-dependencies]
insta = "1.48"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

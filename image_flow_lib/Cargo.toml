[package]
name = "image_flow_lib"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
description.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
name = "image_flow"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "fetch_json_locations"
path = "../scripts/fetch_json_locations.rs"

[[bin]]
name = "asses_image"
path = "../scripts/asses_image.rs"
required-features = ["video", "cli"]

[[bin]]
name = "pipeline"
path = "../scripts/pipeline.rs"
required-features = ["video", "cli"]

[features]
default = ["video"]
video = ["dep:ffmpeg-next"]
cli = ["dep:clap", "dep:zip", "dep:walkdir"]

[dependencies]
kmeans_colors = { version = "0.7", default-features = false, features = [
  "palette_color",
] }
palette = "0.7"
thiserror = "2"
clap = { version = "4.6", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
ffmpeg-next = { version = "9", optional = true }
image = { version = "0.25" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ultralytics-inference = { version = "0.0", default-features = false, features = [
  "annotate",
] }
uniffi.workspace = true
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
zip = { version = "8", optional = true }
walkdir = { version = "2.5", optional = true }
ndarray = { version = "0.17", features = ["serde"] }

[dev-dependencies]
insta = "1.48"
rand = "0.10"
ctor = "1.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "deny"

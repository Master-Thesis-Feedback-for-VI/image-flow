[package]
name = "image_flow_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "image_flow"
crate-type = ["cdylib", "rlib", "staticlib"]

[[example]]
name = "filter_feed"
path = "../examples/filter_feed.rs"

[dependencies]
chrono = "0.4"
jni = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", features = ["serde"] }
uniffi.workspace = true
uuid = { version = "1.24", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = "1.48"

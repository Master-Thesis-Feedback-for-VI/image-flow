[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["image_flow_lib", "uniffi-bindgen-runner"]
exclude = ["vendor/opencv"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Master-Thesis-Feedback-for-VI/image-flow"
readme = "README.md"
description = "TODO"
categories = ["TODO"]
keywords = ["TODO"]

[workspace.dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
